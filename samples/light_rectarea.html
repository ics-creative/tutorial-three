<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three/webgpu";
      import { WebGPURenderer } from "three/webgpu";
      import { RectAreaLightTexturesLib } from "three/addons/lights/RectAreaLightTexturesLib.js";

      const ltc = RectAreaLightTexturesLib.init();
      THREE.RectAreaLightNode.setLTC(ltc);

      // サイズを指定
      const width = 960;
      const height = 540;

      // レンダラーを作成
      const renderer = new WebGPURenderer({
        canvas: document.querySelector("#myCanvas"),
        forceWebGL: true,
      });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(width, height);

      // レンダラーの色空間を設定
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      renderer.setAnimationLoop(tick);

      // シーンを作成
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      // カメラを作成
      const camera = new THREE.PerspectiveCamera(45, width / height);
      camera.position.set(20, 20, 20);
      camera.lookAt(new THREE.Vector3(0, 0, 0));

      // 床を作成
      const meshFloor = new THREE.Mesh(
        new THREE.BoxGeometry(2000, 0.1, 2000),
        new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 1.0 }),
      );
      scene.add(meshFloor);

      // オブジェクトを作成
      const meshKnot = new THREE.Mesh(
        new THREE.TorusKnotGeometry(3, 1, 100, 16),
        new THREE.MeshStandardMaterial({ color: 0xaa0000, roughness: 1.0 }),
      );
      meshKnot.position.set(0, 5, 0);
      scene.add(meshKnot);

      // 矩形光源を作成
      // new THREE.RectAreaLight(色, 光の強さ, 幅, 高さ)
      const light = new THREE.RectAreaLight(0xffffff, 5.0, 10, 10);
      scene.add(light);

      // 毎フレーム時に実行されるループイベントです
      function tick() {
        // レンダリング
        renderer.render(scene, camera);

        // 照明の位置を更新
        const t = Date.now() / 1000;
        const r = 10.0;
        const lx = r * Math.cos(t);
        const lz = r * Math.sin(t);
        const ly = 5.0 + 5.0 * Math.sin(t / 3.0);
        light.position.set(lx, ly, lz);
        light.lookAt(new THREE.Vector3(0, 0, 0));
      }
    </script>
  </head>
  <body>
    <canvas id="myCanvas"></canvas>
  </body>
</html>

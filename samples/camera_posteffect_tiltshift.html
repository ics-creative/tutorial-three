<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three/webgpu";
      import { gaussianBlur } from "three/addons/tsl/display/GaussianBlurNode.js";
      import { abs, mix, pass, smoothstep, uniform, vec2, viewportUV } from "three/tsl";

      // サイズを指定
      const width = 960;
      const height = 540;
      const canvas = document.querySelector("#myCanvas");

      // レンダラーを作成
      const renderer = new THREE.WebGPURenderer({
        canvas,
        antialias: true,
      });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(width, height);
      // レンダラー側で影を有効に
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setAnimationLoop(tick);

      // シーンを作成
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      // カメラを作成
      const camera = new THREE.PerspectiveCamera(30, width / height, 1, 9999);

      const postProcessing = new THREE.PostProcessing(renderer);
      const lookAtTarget = new THREE.Vector3(0, 0, 0);

      // 光源を作成
      {
        const spotLight = new THREE.SpotLight(0xffffff, 200, 2000, Math.PI / 5, 0.2, 0.5);
        spotLight.position.set(500, 300, 500);
        spotLight.castShadow = true; // 影を落とす設定
        spotLight.shadow.mapSize.width = 4096;
        spotLight.shadow.mapSize.height = 4096;
        spotLight.shadow.bias = -0.000001;
        spotLight.shadow.normalBias = 0.02;
        spotLight.shadow.radius = 8;
        scene.add(spotLight);
      }

      // 地面を作成
      {
        // 床のテクスチャー
        const texture = new THREE.TextureLoader().load("imgs/floor.png");
        texture.colorSpace = THREE.SRGBColorSpace; // カラースペースを指定
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping; // リピート可能に
        texture.repeat.set(10, 10); // 10x10マスに設定
        texture.magFilter = THREE.NearestFilter; // アンチエイリアスを外す

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(1000, 1000),
          new THREE.MeshStandardMaterial({
            map: texture,
            roughness: 0.0,
            metalness: 0.6,
          }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true; // 影の設定
        scene.add(floor);
      }

      // マス目を作成
      {
        // 立方体のマテリアルとジオメトリを作成
        const material = new THREE.MeshStandardMaterial({
          color: 0xff2222,
          roughness: 0.1,
          metalness: 0.2,
        });
        const geometry = new THREE.BoxGeometry(45, 45, 45);

        // 立方体を複数作成しランダムに配置
        for (let i = 0; i < 100; i++) {
          const box = new THREE.Mesh(geometry, material);
          box.position.x = Math.round((Math.random() - 0.5) * 19) * 50 + 25;
          box.position.y = 25;
          box.position.z = Math.round((Math.random() - 0.5) * 19) * 50 + 25;
          // 影の設定
          box.receiveShadow = true;
          box.castShadow = true;
          scene.add(box);
        }
      }

      const focusPosUniform = uniform(0.5);
      const blurAmountUniform = uniform(7.0);
      const gradientRadiusUniform = uniform(0.2);
      const scenePass = pass(scene, camera);
      const sceneColor = scenePass.getTextureNode();
      const dist = abs(viewportUV.y.sub(focusPosUniform));
      const blurStrength = smoothstep(gradientRadiusUniform, gradientRadiusUniform.add(0.2), dist);
      const blurredScene = gaussianBlur(sceneColor, vec2(blurAmountUniform, blurAmountUniform), 4);
      postProcessing.outputNode = mix(sceneColor, blurredScene, blurStrength);

      // 毎フレーム時に実行されるループイベントです
      function tick() {
        // 角度に応じてカメラの位置を設定
        camera.position.x = 500 * Math.sin(Date.now() / 2000);
        camera.position.y = 250;
        camera.position.z = 500 * Math.cos(Date.now() / 2000);
        // 原点方向を見つめる
        camera.lookAt(lookAtTarget);

        postProcessing.render();
      }
    </script>
  </head>
  <body>
    <canvas id="myCanvas"></canvas>
  </body>
</html>

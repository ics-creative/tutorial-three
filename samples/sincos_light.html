<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three/webgpu";

      // サイズを指定
      const width = 960;
      const height = 540;

      // 角度
      let rot = 0;

      // レンダラーを作成
      const renderer = new THREE.WebGPURenderer({
        canvas: document.querySelector("#myCanvas"),
      });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(width, height);

      renderer.setAnimationLoop(tick);

      // シーンを作成
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      // 画面上にグリッド（格子）を配置
      const grid = new THREE.GridHelper(1000, 10);
      scene.add(grid);

      // 画面上に3軸を配置
      const axes = new THREE.AxesHelper(1000);
      scene.add(axes);

      // カメラを作成
      const camera = new THREE.PerspectiveCamera(45, width / height);
      camera.position.set(0, 500, +1000);
      camera.lookAt(new THREE.Vector3(0, 0, 0));

      // 平行光源
      const directionalLight = new THREE.DirectionalLight(0xffffff);
      directionalLight.position.set(1, 1, 1);
      scene.add(directionalLight); // シーンに追加

      // 点光源
      const pointLight = new THREE.PointLight(0xffffff);
      scene.add(pointLight); // シーンに追加

      const lightHelper = new THREE.PointLightHelper(pointLight, 10);
      scene.add(lightHelper); // シーンに追加

      // 球体を作成
      const geometry = new THREE.SphereGeometry(300, 30, 30);
      // 画像を読み込む
      const loader = new THREE.TextureLoader();
      const texture = loader.load("imgs/earthmap1k.jpg");
      texture.colorSpace = THREE.SRGBColorSpace; // カラースペースを指定
      // マテリアルにテクスチャーを設定
      const material = new THREE.MeshStandardMaterial({
        map: texture,
      });
      // メッシュを作成
      const mesh = new THREE.Mesh(geometry, material);
      // 3D空間にメッシュを追加
      scene.add(mesh);


      // 毎フレーム時に実行されるループイベントです
      function tick() {
        rot += 1;

        // ラジアンに変換
        const radian = (rot * Math.PI) / 180;

        // ライトの座標に反映
        pointLight.position.x = 500 * Math.cos(radian);
        pointLight.position.z = 500 * Math.sin(radian);

        // レンダリング
        renderer.render(scene, camera);
      }
    </script>
  </head>
  <body>
    <canvas id="myCanvas"></canvas>
  </body>
</html>

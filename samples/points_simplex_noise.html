<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SimplexNoise } from "three/addons/math/SimplexNoise.js";

      // サイズを指定
      const width = 960;
      const height = 540;

      // レンダラーを作成
      const canvasElement = document.querySelector("#myCanvas");
      const renderer = new THREE.WebGPURenderer({
        canvas: canvasElement,
      });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(width, height);

      renderer.setAnimationLoop(tick);

      // シーンを作成
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      // カメラを作成
      const camera = new THREE.PerspectiveCamera(45, width / height);
      camera.position.set(0, 100, -100);
      // カメラコントローラーを作成
      const controls = new OrbitControls(camera, canvasElement);

      // SimplexNoiseインスタンスを作成
      const simplex = new SimplexNoise();

      // 頂点情報を格納する配列
      const vertices = [];

      // 格子のサイズ
      const GRID_SIZE = 60;
      const SPACING = 10;

      // 軌跡の履歴を格納する配列
      const trajectoryHistory = [];
      const MAX_TRAJECTORY_POINTS = 300; // 軌跡の最大ポイント数

      // 各頂点のグリッド座標情報を格納する配列
      const gridPositions = [];

      /**
       * 格子状の座標を計算する共通関数
       * @param {number} index - パーティクルのインデックス
       * @returns {{x: number, z: number}} 格子状の座標オブジェクト
       */
      function getGridPosition(index) {
        const nx = index % ((GRID_SIZE / SPACING) * 2 + 1);
        const nz = Math.floor(index / ((GRID_SIZE / SPACING) * 2 + 1));

        const x = (nx - GRID_SIZE / SPACING) * SPACING;
        const z = (nz - GRID_SIZE / SPACING) * SPACING;

        return { x, z };
      }

      // グリッド座標を計算して配列に格納
      for (let x = -GRID_SIZE; x <= GRID_SIZE; x += SPACING) {
        for (let z = -GRID_SIZE; z <= GRID_SIZE; z += SPACING) {
          // グリッド座標情報を保存
          gridPositions.push({ x, z });
          // すべての頂点を原点から開始
          vertices.push(0, 0, 0);
        }
      }

      // 軌跡履歴の初期化
      const vertexCount = vertices.length / 3;
      for (let i = 0; i < vertexCount; i++) {
        trajectoryHistory[i] = [];
      }

      // 形状データを作成
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));

      // マテリアルを作成
      const material = new THREE.PointsMaterial({
        // 一つ一つのサイズ
        size: 1,
        // 色
        color: 0xffffff,
      });

      // 物体を作成
      const mesh = new THREE.Points(geometry, material);
      scene.add(mesh);

      // 軌跡の線を作成
      const trajectoryLines = [];
      for (let i = 0; i < vertexCount; i++) {
        // 初期状態では同じ点を2つ設定（線として表示されない）
        const lineGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array([0, 0, 0, 0, 0, 0]);
        lineGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const lineMaterial = new THREE.LineBasicMaterial({
          color: 0x00ff00,
          transparent: true,
        });
        const line = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(line);
        trajectoryLines.push(line);
      }

      // GridHelperを作成
      const gridHelper = new THREE.GridHelper(100, 20);
      scene.add(gridHelper);

      // 時間の初期値
      let time = 0;
      let startTime = Date.now();


      // 毎フレーム時に実行されるループイベントです
      function tick() {
        controls.update();

        // 3秒経過したかチェック
        const currentTime = Date.now();
        if (currentTime - startTime > 10_000) {
          // 3秒経過したらリセット
          time = 0;
          startTime = currentTime;

          // 座標もリセット
          const position = mesh.geometry.attributes.position;
          for (let i = 0; i < position.count; i++) {
            const { x, z } = getGridPosition(i);
            position.setXYZ(i, x, 0, z);
          }
          position.needsUpdate = true;

          // 軌跡履歴もリセット
          for (let i = 0; i < vertexCount; i++) {
            trajectoryHistory[i] = [];
          }
        }

        // 時間を更新
        time += 0.001;

        // ポジションを更新
        const position = mesh.geometry.attributes.position;
        for (let i = 0; i < position.count; i++) {
          // グリッド座標情報を取得
          const { x: gridX, z: gridZ } = gridPositions[i];

          // 各頂点のXYZ座標
          const x = position.getX(i);
          const y = position.getY(i);
          const z = position.getZ(i);

          // SimplexNoiseを使ってY座標を計算
          // x, z, timeの3つの引数を与える
          const mul = 0.5;
          // const vx = simplex.noise3d(gridX * 0.002, time, gridZ * 0.002) * mul;
          // const vy = simplex.noise3d(gridZ * 0.02, time, gridX * 0.01) * mul;
          // const vz = simplex.noise3d(time, gridX * 0.01, gridZ * 0.002) * mul;

          const vx = simplex.noise(gridX * 0.002, time) * mul;
          const vy = (simplex.noise(time, gridX * 0.01) + 0.5) * mul;
          const vz = simplex.noise(time, gridZ * 0.01) * mul;

          // 新しい座標を設定
          const newX = x + vx;
          const newY = y + vy;
          const newZ = z + vz;
          position.setXYZ(i, newX, newY, newZ);

          // 軌跡履歴に追加
          trajectoryHistory[i].push(newX, newY, newZ);

          // 軌跡履歴が最大数を超えたら古いものを削除
          if (trajectoryHistory[i].length > MAX_TRAJECTORY_POINTS * 3) {
            trajectoryHistory[i].splice(0, 3);
          }

          // 軌跡の線を更新
          if (trajectoryHistory[i].length >= 6) {
            // 最低2点必要
            const line = trajectoryLines[i];
            const lineGeometry = line.geometry;
            const positions = new Float32Array(trajectoryHistory[i]);
            lineGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
            lineGeometry.computeBoundingSphere();
          }
        }

        // 頂点の更新が必要なことを伝える
        position.needsUpdate = true;

        // レンダリング
        renderer.render(scene, camera);

      }
    </script>
  </head>
  <body>
    <canvas id="myCanvas" style="cursor: move"></canvas>
  </body>
</html>
